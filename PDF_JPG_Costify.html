<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF/JPG Costify - Analysis - www.cnccostify.cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 + ReactDOM: UMD from unpkg (no CORS, no module issues) -->
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script>
        // Wire globals — icons are defined inline (no CDN dependency)
        window.useState    = React.useState;
        window.useEffect   = React.useEffect;
        window.useRef      = React.useRef;
        window.useCallback = React.useCallback;
        window.Fragment    = React.Fragment;
        window.createRoot  = ReactDOM.createRoot;
        window.depsLoaded  = true;
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        // Pin JSX to the *classic* runtime (React.createElement). Newer
        // @babel/standalone builds default preset-react to the *automatic*
        // runtime, which injects `import { jsx } from "react/jsx-runtime"` at
        // the top of the output — an ESM import that is illegal inside a classic
        // <script> and aborts the ENTIRE babel block before renderApp() runs,
        // leaving #root empty (= blank PDF/JPG page). The unpinned CDN URL above
        // means that default can flip under us, so we register an explicit
        // classic-runtime preset and point the babel block at it below. This is
        // version-proof regardless of which @babel/standalone unpkg serves.
        if (window.Babel && Babel.registerPreset && !Babel.availablePresets['react-classic']) {
            Babel.registerPreset('react-classic', {
                presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]]
            });
        }
    </script>
    <style>
        /* Match main app font scale (+2 levels) */
        html { font-size: 18px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Sync UI zoom from parent window's localStorage (set in main app navbar) -->
    <script>
        (function syncUiZoom() {
            try {
                const saved = parseFloat(localStorage.getItem('uiZoomScale')) || 1.0;
                if (saved !== 1.0) {
                    if (window.cncZoom && typeof window.cncZoom.set === 'function') {
                        window.cncZoom.set(saved);
                    } else {
                        document.body.style.zoom = saved;
                    }
                }
                // Listen for storage changes from parent (so zoom updates live)
                window.addEventListener('storage', (e) => {
                    if (e.key !== 'uiZoomScale') return;
                    const v = parseFloat(e.newValue) || 1.0;
                    if (window.cncZoom && typeof window.cncZoom.set === 'function') {
                        window.cncZoom.set(v);
                    } else {
                        document.body.style.zoom = v;
                    }
                });
            } catch (_) { /* ignore */ }
        })();
    </script>

    <script type="text/babel" data-presets="react-classic">
        const checkDeps = setInterval(() => {
            if (window.depsLoaded) { clearInterval(checkDeps); renderApp(); }

        function renderApp() {
            const { React, useState, useEffect, useRef, useCallback, Fragment, createRoot } = window;

            const Settings     = _mk('<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>');
            const AlertCircle  = _mk('<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>');
            const CheckCircle2 = _mk('<path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/>');
            const Trash2       = _mk('<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>');
            const FileSearch   = _mk('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><circle cx="11.5" cy="14.5" r="2.5"/><polyline points="13.25 16.25 15 18"/>');
            const BarChart3    = _mk('<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>');
            const Maximize2    = _mk('<polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>');
            const RefreshCw    = _mk('<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>');
            const ChevronDown  = _mk('<path d="m6 9 6 6 6-6"/>');

            // ─── helpers (mirrors main CNC_Costify_AI_V6 logic exactly) ───────

            // Default cutting groups (fallback when localStorage is empty)
            const DEFAULT_CUTTING_GROUPS = [
                { id: 'easy',          label: 'Easy Cut',        multiplier: 3.7, materials: ['A5083','A6061','ACRYLIC','BRASS','COPPER','EPOXY','NYLON','POM'] },
                { id: 'medium',        label: 'Medium',          multiplier: 4.2, materials: ['A7075','Bakelite','S45C','S45C (F/S)','S50C','S50C (F/S)','SS400','SS400 (F/S)','SUS303','SUS304','SUS316'] },
                { id: 'hard',          label: 'Quite Hard',      multiplier: 5.2, materials: ['CDM','FR-4','G10 ESD','P20','SCM21','SCM415','SCM440','SCM440H','SNCM21','SUJ2'] },
                { id: 'veryHard',      label: 'Hard',            multiplier: 6.0, materials: ['DC53','FR-5','G11','RICOCEL 301F','SKD11','SKD61','STAVAX'] },
                { id: 'extremelyHard', label: 'Extremely Hard',  multiplier: 6.8, materials: ['CARBIDE','HRC เหล็กชุบแข็ง','TITANIUM'] },
            ];

            function loadMaterialData() {
                try {
                    const raw       = JSON.parse(localStorage.getItem('materialGroups') || '[]');
                    const groups    = raw.length > 0 ? raw : DEFAULT_CUTTING_GROUPS;
                    const densities = JSON.parse(localStorage.getItem('materialDensities') || '{}');
                    const prices    = JSON.parse(localStorage.getItem('materialPrices')    || '{}');
                    const allNames  = [];
                    groups.forEach(g => g.materials && g.materials.forEach(m => { if (!allNames.includes(m)) allNames.push(m); }));
                    Object.keys(densities).forEach(m => { if (!allNames.includes(m)) allNames.push(m); });
                    // Starting prices (same key as main app)
                    const spRaw = JSON.parse(localStorage.getItem('startPrices') || '{}');
                    const startPrices = (spRaw && typeof spRaw.cnc === 'number')
                        ? spRaw
                        : { material: 120, coating: 200, cnc: 300, cncSetup: 0 };
                    const cpRaw = JSON.parse(localStorage.getItem('coatingPrices') || '{}');
                    const coatingPrices = Object.keys(cpRaw).length > 0 ? cpRaw : DEFAULT_COATING_PRICES;
                    // V5.8: Coating list is now editable in main app (Add/Edit/Delete) — read coatingList from localStorage
                    // so PDF/JPG dropdown stays in sync. Falls back to BASE_COATING_OPTIONS if user never edited.
                    let coatingOptions;
                    try {
                        const clRaw = JSON.parse(localStorage.getItem('coatingList') || 'null');
                        if (Array.isArray(clRaw) && clRaw.length > 0) {
                            // coatingList items have shape { key, value }; convert to { key, label }
                            coatingOptions = clRaw.map(item => ({ key: item.key, label: item.value || item.key }));
                            // Also include any extra keys from coatingPrices that aren't in coatingList (defensive)
                            const knownKeys = new Set(coatingOptions.map(o => o.key));
                            Object.keys(coatingPrices).forEach(k => {
                                if (!knownKeys.has(k)) coatingOptions.push({ key: k, label: k });
                            });
                        } else {
                            // Fallback: hardcoded base + any custom keys from coatingPrices (V5.7- behavior)
                            const customExtras = Object.keys(coatingPrices)
                                .filter(k => !BASE_COATING_KEYS.has(k))
                                .map(k => ({ key: k, label: k }));
                            coatingOptions = [...BASE_COATING_OPTIONS, ...customExtras];
                        }
                    } catch (_) {
                        coatingOptions = [...BASE_COATING_OPTIONS];
                    }
                    return { allNames: allNames.sort(), densities, prices, groups, startPrices, coatingPrices, coatingOptions };
                } catch {
                    return { allNames: [], densities: {}, prices: {}, groups: DEFAULT_CUTTING_GROUPS,
                             startPrices: { material: 120, coating: 200, cnc: 300, cncSetup: 0 },
                             coatingPrices: DEFAULT_COATING_PRICES,
                             coatingOptions: BASE_COATING_OPTIONS };
                }
            }

            // ── exact copy of parseStockDims from main app ──────────────────
            function parseStockDims(input) {
                if (!input) return [];
                const normalized = input
                    .replace(/[,]/g, '')
                    .replace(/[×X*]/g, 'x')
                    .replace(/[⌀Ø]/g, '')
                    .replace(/mm/gi, '')
                    .replace(/\s+/g, '');
                return normalized.split('x').map(dim => {
                    const clean = String(dim).replace(/[^0-9.\-]/g, '');
                    return parseFloat(clean);
                });
            }

            // ── price rounding — ปัดขึ้นเป็นหลักสิบที่ใกล้ที่สุดเสมอ ────────
            // e.g. 23 → 30, 25.6 → 30, 30 → 30, 1834.21 → 1840
            const roundUp10 = (n) => Math.ceil(n / 10) * 10;

            // ── geometry helpers (exact copy from main app) ─────────────────
            function computeCylinderVolume(dia, length) { return Math.PI * Math.pow(dia / 2, 2) * length; }
            function computeCylinderLateralArea(dia, length) { return Math.PI * dia * length; }
            function computeRectangleMaxFaceArea(h, w, l) {
                const arr = [h, w, l].map(Number).sort((a, b) => a - b);
                return arr[1] * arr[2];
            }
            // Total surface area (mm²) — used for coating cost (sq.inch pricing)
            function computeTotalSurfaceAreaMM2(dims) {
                if (dims.length === 2) { // cylinder [dia, length]
                    const [d, l] = dims;
                    return 2 * Math.PI * Math.pow(d / 2, 2) + Math.PI * d * l;
                } else if (dims.length === 3) { // rectangle [h, w, l]
                    const [h, w, l] = dims;
                    return 2 * (h * w + h * l + w * l);
                }
                return 0;
            }

            // ── Coating defaults (fallback when localStorage is empty) ──────
            const DEFAULT_COATING_PRICES = {
                'Anodize':        { price: 3.5, unit: 'sq.inch' },
                'Zinc Phosphate': { price: 5.0, unit: 'sq.inch' },
                'Hard Chrome':    { price: 7.5, unit: 'sq.inch' },
                'Flat Chrome':    { price: 6.5, unit: 'sq.inch' },
            };

            // Base coating list — mirrors coatingSelect in CNC_Costify_AI_V6 exactly
            // key = localStorage key used in coatingPrices; label = display text
            const BASE_COATING_OPTIONS = [
                { key: 'Nickel',          label: 'Nickel' },
                { key: 'Hard Chrome',     label: 'Hard Chrome' },
                { key: 'Flat Chrome',     label: 'Flat Chrome' },
                { key: 'Zinc Plating',    label: 'Zinc Plating' },
                { key: 'Anodize',         label: 'Anodize' },
                { key: 'Zinc Phosphate',  label: 'Zinc Phosphate' },
                { key: 'Black Oxide',     label: 'Black Oxide' },
                { key: 'Powder Coating',  label: 'Powder Coating' },
                { key: 'Painting',        label: 'Painting' },
                { key: 'Hardening',       label: 'ชุบแข็ง HRc' },
                { key: 'PTFE',            label: 'PTFE (TEFLON)' },
            ];
            const BASE_COATING_KEYS = new Set(BASE_COATING_OPTIONS.map(o => o.key));

            // ── Coating cost per piece ───────────────────────────────────────
            function calcCoatingCostEa(coatingKey, sizeMat, material, densities, coatingPrices) {
                if (!coatingKey || coatingKey === 'noOption') return null;
                const setting = (coatingPrices || {})[coatingKey];
                if (!setting || typeof setting.price !== 'number') return null;
                const dims = parseStockDims(sizeMat);
                if (!Array.isArray(dims) || dims.length === 0 || dims.some(d => isNaN(d) || d <= 0)) return null;
                if (setting.unit === 'sq.inch') {
                    const areaMM2  = computeTotalSurfaceAreaMM2(dims);
                    const areaSqIn = areaMM2 / 645.16;
                    return { cost: areaSqIn * setting.price, areaSqIn, unit: 'sq.inch' };
                } else if (setting.unit === 'kg') {
                    const density = (densities || {})[material];
                    if (!density) return null;
                    let volMM3 = 0;
                    if (dims.length === 2) volMM3 = computeCylinderVolume(dims[0], dims[1]);
                    else if (dims.length === 3) volMM3 = dims[0] * dims[1] * dims[2];
                    const weightKg = (volMM3 / 1000) * density / 1000;
                    return { cost: weightKg * setting.price, weightKg, unit: 'kg' };
                }
                return null;
            }

            // ── CNC cost per piece (PDF/JPG mode) ───────────────────────────
            // STEP file = ground truth (exact 3D geometry measurement).
            // AI is instructed to provide the TRUE removalRatio directly (not a conservative
            // underestimate). No correction factor needed when the prompt is calibrated correctly.
            //
            // Calibration data (STEP vs PDF same parts):
            //   Field Coil S45C:  STEP ratio=37.1%, AI est=40%  → AI accurate (+7.7%)
            //   STAY A5083:       STEP ratio=71.75%, AI est=~70% with new prompt
            //
            // Formula: CNC/Ea. = (stockVol × removalRatio_AI × mult × pb) / 1000
            //   PDF_RATIO_CORRECTION = 1.0 — no correction (AI gives accurate TRUE estimates)
            //
            // Returns { cost, cutVol, correctedCutVol, stockVol,
            //           ratio, correctedRatio, multiplier, groupLabel, pb } or null
            const PDF_RATIO_CORRECTION = 1.0;   // No correction — AI prompt calibrated for accuracy

            function calcCNCCostEa(material, sizeMat, removalRatio, materialGroups, precisionBase) {
                const ratio = (typeof removalRatio === 'number' && removalRatio > 0)
                    ? Math.min(1, Math.max(0, removalRatio)) : null;
                if (ratio === null) return null;

                const dims = parseStockDims(sizeMat);
                if (!Array.isArray(dims) || dims.length === 0 || dims.some(d => isNaN(d) || d <= 0)) return null;

                let stockVol = 0;
                if (dims.length === 2) {          // cylinder: Dia × Length
                    stockVol = computeCylinderVolume(dims[0], dims[1]);
                } else if (dims.length === 3) {   // rectangle: H × W × L
                    stockVol = dims[0] * dims[1] * dims[2];
                } else { return null; }

                const group = (materialGroups || []).find(
                    g => Array.isArray(g.materials) && g.materials.includes(material)
                );
                if (!group || typeof group.multiplier !== 'number') return null;

                const pb              = (typeof precisionBase === 'number' && precisionBase > 0) ? precisionBase : 1.0;
                const cutVol          = stockVol * ratio;                              // raw AI-estimated cut vol
                const correctedRatio  = Math.min(0.95, ratio * PDF_RATIO_CORRECTION); // calibrated to STEP ground truth
                const correctedCutVol = stockVol * correctedRatio;
                const cost            = (correctedCutVol * group.multiplier * pb) / 1000;
                return { cost, cutVol, correctedCutVol, stockVol,
                         ratio, correctedRatio,
                         multiplier: group.multiplier,
                         groupLabel: group.label, pb };
            }

            // ── material cost per piece — same formula as calculateAndSetMaterialCost ──
            // Returns { cost, weightKg, unit } or null if data missing / invalid
            function calcMaterialCostEa(material, sizeMat, densities, prices) {
                const priceSetting = prices[material];
                if (!priceSetting || typeof priceSetting.price !== 'number') return null;

                const dims = parseStockDims(sizeMat);
                if (!Array.isArray(dims) || dims.length === 0 || dims.some(d => isNaN(d) || d <= 0)) return null;

                const isCylinder = dims.length === 2;
                const isRect     = dims.length === 3;

                if (priceSetting.unit === 'kg') {
                    const density = densities[material];
                    if (density === undefined) return null;
                    let volumeMM3 = 0;
                    if (isCylinder) {
                        const [dia, length] = dims;
                        volumeMM3 = computeCylinderVolume(dia, length);
                    } else if (isRect) {
                        const [h, w, l] = dims;
                        volumeMM3 = h * w * l;
                    } else { return null; }
                    const weightKg = (volumeMM3 / 1000) * density / 1000;
                    return { cost: weightKg * priceSetting.price, weightKg, unit: 'kg' };

                } else if (priceSetting.unit === 'mm2') {
                    let areaMM2 = 0;
                    if (isCylinder) {
                        const [dia, length] = dims;
                        areaMM2 = computeCylinderLateralArea(dia, length);
                    } else if (isRect) {
                        const [h, w, l] = dims;
                        areaMM2 = computeRectangleMaxFaceArea(h, w, l);
                    } else { return null; }
                    return { cost: areaMM2 * priceSetting.price, areaMM2, unit: 'mm2' };
                }
                return null;
            }

            // ─── UI Translations (TH / EN) ──────────────────────────────────
            const TRANSLATIONS = {
                th: {
                    // Navbar
                    exportExcel: 'EXPORT EXCEL',
                    pathNotSet: 'ยังไม่ได้ตั้งค่า path (ตั้งค่าในหน้าหลัก)',
                    // File Queue
                    fileQueueTitle: 'คิวไฟล์',
                    addFiles: 'เพิ่มไฟล์แบบงาน (.pdf/รูป)',

                    // Estimation
                    estimationSummary: 'สรุปประมาณราคา',
                    materialsLoaded: (n) => `${n} วัสดุ (โหลดแล้ว)`,
                    // Table headers
                    colPartName: 'ชื่อชิ้นงาน',
                    colPartNoDwg: 'Part No / Dwg No',
                    colMaterial: 'วัสดุ',
                    colSizeMat: 'ขนาดวัสดุ (mm)',
                    colQty: 'จำนวน',
                    colMaterialEa: 'วัสดุ/ชิ้น (THB)',
                    colCncEa: 'CNC/ชิ้น (THB)',
                    colCoatingEa: 'Coating/ชิ้น',
                    colCoatingUnit: '(THB)',
                    colPriceEa: 'ราคา/ชิ้น (THB)',
                    colTotal: 'รวม (THB)',
                    grandTotal: 'ยอดรวมทั้งหมด',
                    noResults: 'ยังไม่มีผลลัพธ์ กรุณาอัปโหลดและประมวลผลไฟล์แบบงาน',
                    // Result row labels
                    minPrice: (n) => `⬆ ราคาขั้นต่ำ ${n}`,
                    calcFromArea: 'คำนวณจากพื้นที่',
                    systemLabel: '✓ ระบบ',
                    aiVal: '⚠ ค่า AI',
                    formulaLabel: '✓ สูตร',
                    noCoating: 'ไม่มี Coating',
                    aiEstBadge: 'AI ประมาณ ✏️',
                    aiEstTooltip: 'ค่านี้ประมาณโดย AI — โปรดตรวจสอบและแก้ไขให้ตรงกับ Stock Size จริง (เช่น จาก STEP file)',
                    sizeMatPlaceholder: 'เช่น 100x200x50',
                    technicalNotesLabel: 'บันทึกเทคนิค',
                    // Status badges
                    statusPending: 'รอประมวลผล',
                    statusProcessing: 'กำลังวิเคราะห์',
                    statusCompleted: 'สำเร็จ',
                    statusError: 'เกิดข้อผิดพลาด',
                    // Combobox
                    searchPlaceholder: (n) => `ค้นหา... (${n})`,
                    notFound: (q) => `ไม่พบ "${q}"`,
                    // Export messages
                    pathNotConfigured: 'ยังไม่ได้ตั้งค่า Excel File Path — กรุณาตั้งค่าในหน้าหลักก่อน',
                    exportSuccess: (count, sheet) => `✅ บันทึกแล้ว ${count} รายการ → Sheet "${sheet}"`,
                    exportFileBusy: '❌ ไฟล์ Excel กำลังเปิดอยู่ กรุณาปิดไฟล์ก่อนแล้วลองใหม่อีกครั้ง',
                    exportError: (msg) => `❌ ${msg}`,
                    exportConnectError: (msg) => `❌ ไม่สามารถเชื่อมต่อ server: ${msg}`,
                    fileTypeError: (files) => `ไม่รองรับไฟล์ประเภทนี้:\n${files}\n\nรองรับเฉพาะ: PDF, JPG, PNG, GIF, WEBP, BMP`,

            function recompute(res, densities, prices, materialGroups, precisionBase, startPrices, coatingPrices) {
                const qty = Math.max(1, Number(res.qty) || 1);
                const sp  = startPrices || { material: 0, cnc: 0, cncSetup: 0 };

                // V5.6: per-row precisionBase override — if user set it manually for this row,
                // use that; otherwise fall back to the global precisionBase argument.
                const effectivePb = (res.precisionOverridden && typeof res.precisionBase === 'number' && res.precisionBase > 0)
                    ? res.precisionBase
                    : precisionBase;

                // ── Material cost ─────────────────────────────────────────────
                const matCalc    = calcMaterialCostEa(res.material, res.sizeMat, densities, prices);
                let unitMaterial = matCalc !== null ? matCalc.cost : (res.unitMaterial || 0);
                const fromSystem = matCalc !== null;
                const weightKg   = matCalc?.weightKg ?? null;
                // Apply material starting price (minimum) then round up to nearest 10
                const minMaterial   = typeof sp.material === 'number' ? sp.material : 0;
                const matCapped     = unitMaterial < minMaterial;
                if (matCapped) unitMaterial = minMaterial;
                unitMaterial = roundUp10(unitMaterial);

                // ── CNC cost — formula: stockVol × ratio × multiplier × pb / 1000 ──
                const cncCalc       = calcCNCCostEa(res.material, res.sizeMat, res.removalRatio, materialGroups, effectivePb);
                let unitCnc         = cncCalc !== null ? cncCalc.cost : (res.unitCnc || 0);
                const cncFromSystem = cncCalc !== null;
                // Apply CNC starting price (minimum) then round up to nearest 10
                const minCnc  = typeof sp.cnc === 'number' ? sp.cnc : 0;
                const cncCapped = unitCnc < minCnc;
                if (cncCapped) unitCnc = minCnc;
                unitCnc = roundUp10(unitCnc);

                // ── CNC Setup (amortized) — same rule as main app ─────────────
                // qty=1 → full setup cost; qty≥2 → setup / qty
                const setupTotal  = typeof sp.cncSetup === 'number' ? sp.cncSetup : 0;
                const unitSetup   = setupTotal > 0 ? setupTotal / qty : 0;

                // ── Coating cost ──────────────────────────────────────────────
                const coatingCalc = calcCoatingCostEa(res.coating, res.sizeMat, res.material, densities, coatingPrices);
                let unitCoating   = coatingCalc !== null ? coatingCalc.cost : 0;
                const minCoating  = typeof sp.coating === 'number' ? sp.coating : 0;
                if (unitCoating > 0 && unitCoating < minCoating) unitCoating = minCoating;
                if (unitCoating > 0) unitCoating = roundUp10(unitCoating);

                // ── Final price — round priceEa to nearest 10 ─────────────────
                const priceEa   = roundUp10(unitMaterial + unitCnc + unitSetup + unitCoating);
                const totalCost = priceEa * qty;

                return { ...res, qty, unitMaterial, unitCnc, unitSetup, unitCoating, priceEa, totalCost,
                         precisionBase: effectivePb,  // V5.6: persist effective PB so UI selector shows correct value
                         fromSystem, weightKg, cncFromSystem, cncCalcDetail: cncCalc,
                         matCapped, cncCapped, setupTotal, coatingCalcDetail: coatingCalc };
            }

            // ═══ V5.12: Speed-up helpers — cache + image resize + prewarm ═══
            // Each is safe (no accuracy impact, no feature change).

            const CACHE_VERSION = 'v1';   // bump to invalidate all cached entries
            const CACHE_INDEX_KEY = 'aey:_index';
            const CACHE_MAX_ENTRIES = 100;

            /** sha256 of an ArrayBuffer → hex string */
            async function _sha256Hex(buf) {
                const h = await crypto.subtle.digest('SHA-256', buf);
                return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, '0')).join('');
            }

            /** Hash the raw bytes of a File. */
            async function _hashFile(file) {
                const buf = await file.arrayBuffer();
                return _sha256Hex(buf);
            }

            function _cacheKey(fileHash, model) {
                return `aey:${CACHE_VERSION}:${model || 'auto'}:${fileHash}`;
            }

            /** Read result from cache. Returns parsed object or null. */
            function _cacheGet(fileHash, model) {
                try {
                    const raw = localStorage.getItem(_cacheKey(fileHash, model));
                    return raw ? JSON.parse(raw) : null;
                } catch (_) { return null; }
            }

            /** Save result to cache + update LRU index. Eviction at MAX_ENTRIES. */
            function _cacheSet(fileHash, model, value) {
                try {
                    const key = _cacheKey(fileHash, model);
                    localStorage.setItem(key, JSON.stringify(value));
                    // LRU index
                    let idx = [];
                    try { idx = JSON.parse(localStorage.getItem(CACHE_INDEX_KEY) || '[]'); } catch (_) {}
                    idx = idx.filter(k => k !== key);  // remove dup
                    idx.push(key);                      // newest at end
                    while (idx.length > CACHE_MAX_ENTRIES) {
                        const old = idx.shift();
                        try { localStorage.removeItem(old); } catch (_) {}
                    }
                    localStorage.setItem(CACHE_INDEX_KEY, JSON.stringify(idx));
                } catch (e) {
                    // localStorage might be full — best-effort, no crash.
                    console.warn('[cache] write failed:', e.message);
                }
            }

            /** Clear all cached analysis results. */
            function _cacheClearAll() {
                try {
                    const idx = JSON.parse(localStorage.getItem(CACHE_INDEX_KEY) || '[]');
                    idx.forEach(k => { try { localStorage.removeItem(k); } catch (_) {} });
                    localStorage.removeItem(CACHE_INDEX_KEY);
                } catch (_) {}
            }

            /** Resize an image File to max dimension (default 2048px) and return
             *  base64 of the JPEG output. Returns null for PDFs (skip).
             *  Preserves aspect ratio; skips resize if already small. */
            async function _resizeImageToBase64(file, maxDim = 2048, quality = 0.9) {
                const mime = (file.type || '').toLowerCase();
                if (mime.includes('pdf')) return null;  // PDF: skip — keep original
                if (!mime.startsWith('image/')) return null;
                if (file.size < 500 * 1024) return null; // <500KB: skip — already small

                const dataUrl = await new Promise((resolve, reject) => {
                    const r = new FileReader();
                    r.onload = () => resolve(r.result);
                    r.onerror = reject;
                    r.readAsDataURL(file);
                });
                const img = await new Promise((resolve, reject) => {
                    const im = new Image();
                    im.onload = () => resolve(im);
                    im.onerror = reject;
                    im.src = dataUrl;
                });
                const w = img.naturalWidth, h = img.naturalHeight;
                const biggest = Math.max(w, h);
                if (biggest <= maxDim) return null; // already within budget — no resize
                const scale = maxDim / biggest;
                const tw = Math.round(w * scale), th = Math.round(h * scale);
                const canvas = document.createElement('canvas');
                canvas.width = tw; canvas.height = th;
                const ctx = canvas.getContext('2d');
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(img, 0, 0, tw, th);
                const outDataUrl = canvas.toDataURL('image/jpeg', quality);
                return { base64: outDataUrl.split(',')[1], mimeType: 'image/jpeg', originalDim: [w, h], outputDim: [tw, th] };
            }

            /** Pre-warm HTTPS connection on app mount. Cheap GET to a known endpoint
             *  so DNS+TLS handshake completes BEFORE user's first analyze. */
            let _prewarmDone = false;
            function _prewarmConnection() {

                _prewarmDone = true;
                try {
                    fetch('/api/config/ai', { method: 'GET', cache: 'no-store' }).catch(() => {});
                } catch (_) {}
            }

                // ── file helpers ─────────────────────────────────────────────
                const ALLOWED_MIME = new Set([
                    'image/jpeg','image/jpg','image/png','image/gif',

                ]);
                const ALLOWED_EXT = /\.(jpe?g|png|gif|webp|bmp|tiff?|pdf)$/i;

                const _validateAndWrap = (files) => {
                    const accepted = [];
                    const rejected = [];
                    for (const file of files) {
                        const ok = ALLOWED_MIME.has(file.type) || ALLOWED_EXT.test(file.name);
                        if (!ok) { rejected.push(file.name); continue; }
                        accepted.push({
                            file,
                            id: Math.random().toString(36).substr(2, 9),

                            preview: file.type.startsWith('image/') ? URL.createObjectURL(file) : null

                const onFileChange = (e) => {
                    const accepted = _validateAndWrap(Array.from(e.target.files));

                };

                // ── analyze ──────────────────────────────────────────────────
                const analyzeFile = async (fileObj) => {

                    // V5.12 #1: Cache check — hash file + look up result by hash
                    // Cache scoped per (model, file content), invalidated when model changes.

                    } catch (_) { /* hashing failed — fall through to live API */ }

                    // V5.12 #2: Image resize for large JPG/PNG → reduce payload + AI time

                    const systemPrompt = `You are a professional CNC Engineering and Pricing Expert.
Analyze the engineering drawing and extract the following:

1. Part Name.

   ════════════════════════════════════════════════════════════════
   ⚡ PRIORITY RULE — DETECT STOCK SIZE IN THIS STRICT ORDER
   ════════════════════════════════════════════════════════════════

   ── PRIORITY 1 (HIGHEST): HIGHLIGHTED / COLOR-BOXED DIMENSIONS ──────────
   Scan the ENTIRE drawing for dimension numbers enclosed in:

   Only if neither Priority 1 nor Priority 2 yields a result:

${rateLines}

   Steps:
   a) Identify the material's cutting group from the rate card above.
   b) Compute StockVolume from Size Mat: rectangle = H×W×L, cylinder = π×(D/2)²×L.

9. removalRatio — TRUE fraction of stock volume machined away (chip volume ÷ stock volume).
   Verified against real 3D STEP geometry. Accuracy is critical — do NOT overestimate.

   ═══ CORE METHOD: "Bounding-Box Fill Fraction" ═══
   Step 1 — Estimate FILL FRACTION: From the drawing views, estimate what fraction of
            the bounding-box volume is SOLID MATERIAL in the finished part.
            • A mostly-solid boxy housing → fill ≈ 0.60–0.75
            • A moderately machined block → fill ≈ 0.45–0.60
            • A thin bracket with large cutouts → fill ≈ 0.20–0.40
   Step 2 — removalRatio = 1 − fill_fraction

   ═══ CALIBRATED REFERENCE TABLE (from real 3D data) ═══
   Part description                                    fill    removalRatio
   ─────────────────────────────────────────────────────────────────────
   Flat bar/plate — edge profile only, mostly intact   0.80+   0.05–0.20
   Housing / Body / Coil / Assembly — solid block      0.60–0.75  0.25–0.40

   Block machined on 2–3 faces, moderate pockets       0.50–0.65  0.35–0.50
   Parts with slots, ribs, moderate pockets 3+ faces   0.40–0.55  0.45–0.60
   Thin bracket / Stay / Mount — large cutouts,        0.20–0.40  0.60–0.80
     most stock between features is REMOVED
   Near-complete machining — thin walls, deep ribs     <0.20      0.80–0.95

   ═══ CRITICAL RULES — READ CAREFULLY ═══
   ✦ "Step profiles on multiple faces" does NOT mean high removal.
     A SOLID HOUSING with surface steps retains 60–75% of stock → ratio 0.25–0.40.
     Only use 0.60–0.80 if the part is clearly a THIN BRACKET where most stock
     BETWEEN the remaining walls is air/cut-away.

   ✦ Part name keywords → expected ratio range:
     "Housing", "Body", "Coil", "Yoke", "Frame", "Assy", "Assembly",
     "Block", "Plate", "Jig", "Fixture", "Checking Mach" → 0.20–0.45
     "Stay", "Bracket", "Mount", "Arm" (thin, mostly cut-through) → 0.55–0.80

   ✦ THICKNESS check: if the part is thin (e.g. 28 mm) but has a LARGE FLAT FACE
     (e.g. 200×200 mm) — the step profiles are shallow relative to total volume
     → most material in the flat face remains solid → ratio typically 0.25–0.45.

   ✦ Calibration examples (verified STEP data):
     • S45C Housing 28×223×226 mm, profiles on all faces  → removalRatio = 0.37

                                            <table className="w-full border-separate border-spacing-y-3">
                                                <thead>
                                                    <tr className="text-sm font-black text-slate-500 uppercase tracking-wider">
                                                        <th className="px-3 py-2 text-left whitespace-nowrap">
                                                            <div>{t.colPartName}</div>
                                                            <div className="text-xs text-slate-400 tracking-normal font-normal">{t.colPartNoDwg}</div>
                                                        </th>
                                                        <th className="px-3 py-2 text-left whitespace-nowrap">
                                                            <div>{t.colMaterial}</div>
                                                            <div className="text-xs text-slate-400 tracking-normal font-normal">{t.colSizeMat}</div>
                                                        </th>
                                                        <th className="px-3 py-2 text-center whitespace-nowrap">{t.colQty}</th>
                                                        <th className="px-3 py-2 text-right whitespace-nowrap">{t.colMaterialEa}</th>
                                                        <th className="px-3 py-2 text-right whitespace-nowrap">{t.colCncEa}</th>
                                                        <th className="px-3 py-2 text-right text-violet-600 whitespace-nowrap">
                                                            <div>{t.colCoatingEa} <span className="text-xs text-violet-400 tracking-normal font-normal">{t.colCoatingUnit}</span></div>
                                                        </th>
                                                        <th className="px-3 py-2 text-right text-blue-600 whitespace-nowrap">{t.colPriceEa}</th>
                                                        <th className="px-3 py-2 text-right whitespace-nowrap">{t.colTotal}</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {results.map((res, i) => (
                                                        <ResultRow
                                                            key={res.fileId}
                                                            res={res}
                                                            matData={matData}
                                                            startPrices={matData.startPrices}
                                                            onUpdate={updateResult}
                                                            lang={lang}
                                                            Settings={Settings}
                                                            Maximize2={Maximize2}
                                                            ChevronDown={ChevronDown}
                                                        />
                                                    ))}
                                                    {results.length === 0 && (
                                                        <tr>
                                                            <td colSpan="8" className="py-32 text-center text-slate-300 italic text-sm">
                                                                <Calculator className="w-12 h-12 mx-auto mb-4 opacity-10" />
                                                                {t.noResults}
                                                            </td>
                                                        </tr>
                                                    )}
                                                    {results.length > 0 && (
                                                        <tr>
                                                            <td colSpan="8" className="px-4 py-3 text-right font-black text-slate-600 text-sm">{t.grandTotal}</td>
                                                            <td className="px-4 py-3 text-right">
                                                                <span className="text-lg font-black text-emerald-600">{grandTotal.toLocaleString('th', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
                                                            </td>
                                                        </tr>
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </main>
                        <style>{`
                            .custom-scrollbar::-webkit-scrollbar { width: 4px; }
                            .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
                            .editable-cell { transition: background .15s; }
                            .editable-cell:focus { outline: 2px solid #3b82f6; outline-offset: 1px; background: #eff6ff; border-radius: 6px; }
                            select.editable-cell { cursor: pointer; }
                        `}</style>

                    </div>
                );
            };

            // ─── MaterialCombobox — searchable + filterable dropdown ────────
            const MaterialCombobox = ({ value, options, onChange, ChevronDown, lang }) => {
                const t = TRANSLATIONS[lang] || TRANSLATIONS.th;
                const [query,  setQuery]  = useState('');
                const [open,   setOpen]   = useState(false);
                const wrapRef = useRef(null);

                // Close when clicking outside
                useEffect(() => {
                    const handler = (e) => {
                        if (wrapRef.current && !wrapRef.current.contains(e.target)) {
                            setOpen(false);
                            setQuery('');
                        }
                    };
                    document.addEventListener('mousedown', handler);
                    return () => document.removeEventListener('mousedown', handler);
                }, []);

                const filtered = query.trim() === ''
                    ? options
                    : options.filter(m => m.toLowerCase().includes(query.toLowerCase()));

                const select = (m) => {
                    onChange(m);
                    setOpen(false);
                    setQuery('');
                };

                return (
                    <div ref={wrapRef} className="relative">
                        {/* Input field */}
                        <div className="flex items-center bg-blue-50 border border-blue-200 rounded-lg overflow-hidden hover:bg-blue-100 transition">
                            <input
                                type="text"
                                value={open ? query : value}
                                placeholder={open ? t.searchPlaceholder(options.length) : value}
                                onFocus={() => { setOpen(true); setQuery(''); }}
                                onChange={(e) => setQuery(e.target.value)}
                                className="w-full text-xs font-bold text-blue-700 bg-transparent px-2 py-1 outline-none placeholder:text-blue-400 placeholder:font-normal"
                            />
                            <button
                                type="button"
                                onMouseDown={(e) => { e.preventDefault(); setOpen(o => !o); if (!open) setQuery(''); }}
                                className="px-1.5 text-blue-400 hover:text-blue-600"
                            >
                                <ChevronDown className={`w-3 h-3 transition-transform ${open ? 'rotate-180' : ''}`} />
                            </button>
                        </div>

                        {/* Dropdown list */}
                        {open && (
                            <div className="absolute z-50 mt-1 w-full min-w-[180px] bg-white border border-blue-200 rounded-xl shadow-xl max-h-52 overflow-y-auto">
                                {filtered.length === 0 ? (
                                    <div className="px-3 py-2 text-[11px] text-slate-400 italic">{t.notFound(query)}</div>
                                ) : filtered.map(m => (
                                    <div
                                        key={m}
                                        onMouseDown={(e) => { e.preventDefault(); select(m); }}
                                        className={`px-3 py-1.5 text-xs cursor-pointer transition-colors
                                            ${m === value
                                                ? 'bg-blue-600 text-white font-bold'
                                                : 'text-slate-700 hover:bg-blue-50 hover:text-blue-700'}`}
                                    >
                                        {query.trim() ? (
                                            // Highlight matching part
                                            <HighlightMatch text={m} query={query} />
                                        ) : m}
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                );
            };

            // Highlight matched text in dropdown items
            const HighlightMatch = ({ text, query }) => {
                if (!query) return <span>{text}</span>;
                const idx = text.toLowerCase().indexOf(query.toLowerCase());
                if (idx === -1) return <span>{text}</span>;
                return (
                    <span>
                        {text.slice(0, idx)}
                        <mark className="bg-yellow-200 text-blue-800 rounded-sm">{text.slice(idx, idx + query.length)}</mark>
                        {text.slice(idx + query.length)}
                    </span>
                );
            };

            // ─── ResultRow ───────────────────────────────────────────────────
            const ResultRow = ({ res, matData, startPrices, onUpdate, lang, Settings, Maximize2, ChevronDown }) => {
                const t = TRANSLATIONS[lang] || TRANSLATIONS.th;
                const fmt = (n, d = 2) => isNaN(n) ? '-' : Number(n).toLocaleString('th', { minimumFractionDigits: 0, maximumFractionDigits: d });

                const handleMaterial     = (val) => onUpdate(res.fileId, 'material', val);
                const handleSizeMat      = (e)   => onUpdate(res.fileId, 'sizeMat',  e.target.value, { sizeMatEdited: true });
                const handleQty          = (e)   => {
                    const v = parseInt(e.target.value, 10);
                    if (!isNaN(v) && v > 0) onUpdate(res.fileId, 'qty', v);
                };
                const handleRemovalRatio = (e)   => {
                    const pct = parseFloat(e.target.value);
                    if (!isNaN(pct) && pct >= 1 && pct <= 99)
                        onUpdate(res.fileId, 'removalRatio', pct / 100);
                };
                const handleCoating      = (e)   => onUpdate(res.fileId, 'coating', e.target.value);

                const hasSystemPrice  = res.fromSystem === true;
                const priceUnit       = matData.prices[res.material]?.unit || 'kg';
                const sp              = startPrices || {};
                const coatingPrices   = matData.coatingPrices || {};
                const coatingOptions  = matData.coatingOptions || BASE_COATING_OPTIONS;

                return (
                    <React.Fragment>
                        <tr className="bg-white shadow-sm hover:shadow-md transition-all">
                            {/* Part Name */}
                            <td className="px-4 py-4 rounded-l-2xl font-black text-slate-800 border-y border-l border-slate-100 text-sm">
                                <div className="flex flex-col gap-1">
                                    <span>{res.partName}</span>
                                    {(res.partNo || res.drawingNo) && (
                                        <div className="text-[10px] text-slate-500 font-normal">
                                            {res.partNo    && <span>No: {res.partNo}</span>}
                                            {res.partNo && res.drawingNo && <span className="mx-1">|</span>}
                                            {res.drawingNo && <span>Dwg: {res.drawingNo}</span>}
                                        </div>
                                    )}
                                    {/* Engine badge — which AI analyzed this file */}
                                    {res._engine && (
                                        <span title={
                                                res._engine === 'openrouter' ? `วิเคราะห์ด้วย OpenRouter${res._model ? ' (' + res._model + ')' : ''}` :
                                                'วิเคราะห์ด้วย Gemini API'}
                                            className={`text-[9px] font-bold px-1.5 py-0.5 rounded-md w-fit
                                                ${res._engine === 'openrouter'
                                                    ? 'bg-amber-100 text-amber-800 border border-amber-200'
                                                    : 'bg-blue-50 text-blue-500 border border-blue-100'}`}>
                                            {res._engine === 'openrouter'
                                                ? `🔀 OpenRouter${res._model ? ' (' + res._model + ')' : ''}`
                                                : '☁️ Gemini'}
                                        </span>
                                    )}
                                    {/* AI cost badge — token cost converted to THB */}
                                    {typeof res._costThb === 'number' && (
                                        <span className="text-[9px] font-bold px-1.5 py-0.5 rounded-md w-fit bg-emerald-50 text-emerald-700 border border-emerald-200"
                                              title={`${res._tokensIn || 0} in / ${res._tokensOut || 0} out tokens — $${(res._costUsd || 0).toFixed(6)}`}>
                                            {res._costThb === 0
                                                ? '💰 ฟรี'
                                                : `💰 ${res._costThb < 0.01 ? res._costThb.toFixed(4) : res._costThb.toFixed(2)} บาท`}
                                        </span>
                                    )}
                                </div>
                            </td>

                            {/* Material + SizeMat — editable */}
                            <td className="px-3 py-4 border-y border-slate-100 min-w-[140px] lg:min-w-[170px] xl:min-w-[190px]">
                                <div className="flex flex-col gap-2">
                                    {/* Searchable material combobox */}
                                    <MaterialCombobox
                                        value={res.material}
                                        options={matData.allNames.length > 0 ? matData.allNames : [res.material]}
                                        onChange={handleMaterial}
                                        ChevronDown={ChevronDown}
                                        lang={lang}
                                    />
                                    {/* Size Mat editable */}
                                    <div className="flex items-center gap-1">
                                        <Maximize2 className="w-3 h-3 flex-shrink-0 text-slate-400" />
                                        <div className="relative w-full">
                                            {!res.sizeMatEdited && res.sizeMat && (
                                                <span
                                                    title={t.aiEstTooltip}
                                                    className="absolute -top-2.5 right-0 text-[8px] font-bold bg-amber-100 text-amber-700 border border-amber-300 rounded px-1 leading-4 cursor-help z-10 select-none whitespace-nowrap"
                                                >
                                                    {t.aiEstBadge}
                                                </span>
                                            )}
                                            <input
                                                type="text"
                                                value={res.sizeMat}
                                                onChange={handleSizeMat}
                                                placeholder={t.sizeMatPlaceholder}
                                                className={`editable-cell w-full text-[11px] font-bold rounded-md px-2 py-0.5 hover:bg-white transition ${
                                                    !res.sizeMatEdited && res.sizeMat
                                                        ? 'bg-amber-50 border border-amber-300'
                                                        : 'bg-slate-50 border border-slate-200'
                                                }`}
                                            />
                                        </div>
                                    </div>
                                    {/* Coating dropdown */}
                                    <div className="flex items-center gap-1 mt-1">
                                        <span className="text-[9px] text-slate-400 flex-shrink-0 w-3">🎨</span>
                                        <select
                                            value={res.coating || 'noOption'}
                                            onChange={handleCoating}
                                            className="editable-cell w-full text-[11px] font-bold bg-slate-50 border border-slate-200 rounded-md px-2 py-0.5 hover:bg-white transition text-slate-600"
                                        >
                                            <option value="noOption">{t.noCoating}</option>
                                            {coatingOptions.map(o => (
                                                <option key={o.key} value={o.key}>{o.label}</option>
                                            ))}
                                        </select>
                                    </div>
                                    {/* Removal Ratio — background only, not shown in UI */}
                                </div>
                            </td>

                            {/* QTY — editable */}
                            <td className="px-4 py-4 border-y border-slate-100 text-center">
                                <input
                                    type="number"
                                    min="1"
                                    value={res.qty}
                                    onChange={handleQty}
                                    className="editable-cell w-16 text-center text-sm font-bold bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 hover:bg-white transition"
                                />
                            </td>

                            {/* Material/Ea. */}
                            <td className="px-4 py-4 border-y border-slate-100 text-right font-bold text-slate-600 text-sm">
                                {fmt(res.unitMaterial)}
                                {res.matCapped ? (
                                    <div className="text-[11px] text-orange-500 font-normal">{t.minPrice(fmt(sp.material))}</div>
                                ) : hasSystemPrice ? (
                                    <div className="text-[11px] text-emerald-500 font-normal">
                                        {priceUnit === 'kg' && res.weightKg != null
                                            ? `${res.weightKg.toFixed(3)} kg`
                                            : priceUnit === 'mm2' ? t.calcFromArea : ''}
                                        {' '}{t.systemLabel}
                                    </div>
                                ) : (
                                    <div className="text-[11px] text-amber-500 font-normal">{t.aiVal}</div>
                                )}
                            </td>

                            {/* CNC/Ea. (includes amortized setup) */}
                            <td className="px-4 py-4 border-y border-slate-100 text-right font-bold text-slate-500 text-sm">
                                {fmt(res.unitCnc)}
                                {res.cncCapped ? (
                                    <div className="text-[11px] text-orange-500 font-normal">{t.minPrice(fmt(sp.cnc))}</div>
                                ) : res.cncFromSystem ? (
                                    <div className="text-[11px] text-indigo-500 font-normal">{t.formulaLabel}</div>
                                ) : (
                                    <div className="text-[11px] text-amber-500 font-normal">{t.aiVal}</div>
                                )}
                                {/* CNC Setup amortized */}
                                {res.unitSetup > 0 && (
                                    <div className="text-[11px] text-violet-500 font-normal mt-0.5">
                                        +Setup {fmt(res.setupTotal)}÷{res.qty} = {fmt(res.unitSetup)}
                                    </div>
                                )}
                                {/* V5.7: per-row Precision Base override (font bumped for readability) */}
                                <div className="mt-1.5 flex items-center gap-1 justify-end">
                                    <span className="text-[11px] text-slate-500 uppercase tracking-wider font-bold">PB:</span>
                                    <select
                                        value={(typeof res.precisionBase === 'number' ? res.precisionBase : 1.0).toFixed(1)}
                                        onChange={e => onUpdate(res.fileId, 'precisionBase', parseFloat(e.target.value), { precisionOverridden: true })}
                                        title={res.precisionOverridden ? 'Per-row override (กำหนดเฉพาะแถวนี้)' : 'Default (ยังไม่ override)'}
                                        className={`text-xs font-bold bg-transparent border border-slate-200 rounded px-1.5 py-0.5 outline-none cursor-pointer ${res.precisionOverridden ? 'text-indigo-700 bg-indigo-50 border-indigo-300' : 'text-slate-600'}`}
                                    >
                                        <option value="1.0">1 (×1.0)</option>
                                        <option value="1.2">2 (×1.2)</option>
                                        <option value="1.3">3 (×1.3)</option>
                                        <option value="1.4">4 (×1.4)</option>
                                        <option value="1.5">5 (×1.5)</option>
                                        <option value="1.6">6 (×1.6)</option>
                                        <option value="1.7">7 (×1.7)</option>
                                        <option value="1.8">8 (×1.8)</option>
                                        <option value="1.9">9 (×1.9)</option>
                                        <option value="2.0">10 (×2.0)</option>
                                        <option value="2.1">11 (×2.1)</option>
                                        <option value="2.2">12 (×2.2)</option>
                                        <option value="2.3">13 (×2.3)</option>
                                        <option value="2.4">14 (×2.4)</option>
                                        <option value="2.5">15 (×2.5)</option>
                                        <option value="2.6">16 (×2.6)</option>
                                        <option value="2.7">17 (×2.7)</option>
                                        <option value="2.8">18 (×2.8)</option>
                                        <option value="2.9">19 (×2.9)</option>
                                        <option value="3.0">20 (×3.0)</option>
                                    </select>
                                </div>
                            </td>

                            {/* Coating/Ea. */}
                            <td className="px-4 py-4 border-y border-slate-100 text-right font-bold text-violet-600 text-sm">
                                {res.unitCoating > 0 ? (
                                    <>
                                        {fmt(res.unitCoating)}
                                        <div className="text-[11px] text-violet-400 font-normal">
                                            {res.coatingCalcDetail?.unit === 'sq.inch'
                                                ? `${(res.coatingCalcDetail.areaSqIn || 0).toFixed(1)} in²`
                                                : res.coatingCalcDetail?.unit === 'kg'
                                                    ? `${(res.coatingCalcDetail.weightKg || 0).toFixed(3)} kg`
                                                    : ''}
                                        </div>
                                    </>
                                ) : (
                                    <span className="text-slate-300 font-normal text-[11px]">—</span>
                                )}
                            </td>

                            {/* Price/Ea. */}
                            <td className="px-4 py-4 border-y border-slate-100 text-right font-black text-blue-700 bg-blue-50/40 hover:bg-blue-50 transition text-sm">
                                {fmt(res.priceEa)}
                            </td>

                            {/* Total */}
                            <td className="px-4 py-4 rounded-r-2xl border-y border-r border-slate-100 text-right">
                                <span className="text-base font-black text-emerald-600">{fmt(res.totalCost)}</span>
                            </td>
                        </tr>

                        {/* Technical Notes row */}
                        <tr>
                            <td colSpan="8" className="px-4 pb-4">
                                <div className="bg-slate-50/50 p-3 rounded-xl border border-slate-100 text-[11px] text-slate-500 italic flex gap-2">
                                    <Settings className="w-3.5 h-3.5 mt-0.5 text-slate-400 flex-shrink-0" />
                                    <span>
                                        <b>{t.technicalNotesLabel}:</b>{' '}
                                        {lang === 'th'
                                            ? (res.technicalNotesTH || res.technicalNotes || '')
                                            : (res.technicalNotesEN || res.technicalNotes || '')}
                                    </span>
                                </div>
                            </td>
                        </tr>
                    </React.Fragment>
                );
            };

            // ─── StatusBadge (V5.11: with elapsed-time clock for processing files) ──
            const StatusBadge = ({ status, lang, startedAt, elapsedMs }) => {
                const t = TRANSLATIONS[lang] || TRANSLATIONS.th;
                // Live ticker — re-render every 1s while in "processing" so the user
                // sees the elapsed seconds counting up. No render when status changes.
                const [, _tick] = useState(0);
                useEffect(() => {
                    if (status !== 'processing' || !startedAt) return;
                    const id = setInterval(() => _tick(n => n + 1), 1000);
                    return () => clearInterval(id);
                }, [status, startedAt]);

                const configs = {
                    pending:    { label: t.statusPending,    color: 'bg-slate-200 text-slate-600' },
                    processing: { label: t.statusProcessing, color: 'bg-blue-100 text-blue-600 animate-pulse' },
                    completed:  { label: t.statusCompleted,  color: 'bg-emerald-100 text-emerald-600' },
                    error:      { label: t.statusError,      color: 'bg-red-100 text-red-600' }
                };
                const c = configs[status] || configs.pending;

                let suffix = '';
                if (status === 'processing' && startedAt) {
                    const sec = Math.max(0, Math.floor((Date.now() - startedAt) / 1000));
                    suffix = ` · ${sec}s`;
                } else if (status === 'completed' && typeof elapsedMs === 'number' && elapsedMs > 0) {
                    // V5.12: <100ms strongly implies cache hit — flag visually
                    suffix = elapsedMs < 100 ? ' · ⚡cached' : ` · ${(elapsedMs / 1000).toFixed(1)}s`;
                }
                return <span className={`text-[8px] font-black px-1.5 py-0.5 rounded uppercase mt-0.5 inline-block ${c.color}`}>{c.label}{suffix}</span>;
            };

            const root = createRoot(document.getElementById('root'));
            root.render(<App />);
        }
    </script>
</body>
</html>
