<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin License Tool</title>
    <style>
      :root {
        --bg: #0f172a;           /* slate-900 */
        --panel: #0b1220;        /* darker panel */
        --card: #111827;         /* slate-800 */
        --muted: #94a3b8;        /* slate-400 */
        --text: #e5e7eb;         /* slate-200 */
        --primary: #3b82f6;      /* blue-500 */
        --primary-600: #2563eb;  /* blue-600 */
        --accent: #22c55e;       /* green-500 */
        --danger: #ef4444;       /* red-500 */
        --radius: 14px;
        --shadow: 0 10px 25px rgba(0,0,0,0.35);
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
        background: radial-gradient(1100px 500px at 10% -10%, #1e293b, transparent),
                    radial-gradient(800px 400px at 90% -40%, #0b6eef33, transparent),
                    var(--bg);
        color: var(--text);
      }

      .container {
        max-width: 1000px;
        margin: 24px auto 40px;
        padding: 0 20px;
      }

      .hero {
        background: linear-gradient(135deg, rgba(59,130,246,.35), rgba(34,197,94,.28));
        border: 1px solid rgba(148,163,184,.25);
        border-radius: var(--radius);
        padding: 18px 22px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(6px);
        margin-bottom: 18px;
      }
      .hero h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: .3px; }
      .hero p { margin: 0; color: var(--muted); }

      .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

      .card {
        background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
        border: 1px solid rgba(148,163,184,.2);
        border-radius: var(--radius);
        padding: 16px;
        margin-bottom: 16px;
        box-shadow: var(--shadow);
      }

      .card h3 { margin: 0 0 10px; font-size: 16px; color: #cbd5e1; }

      label { display: block; margin: 8px 0 6px; color: var(--muted); font-size: 13px; }
      input, select, textarea {
        width: 100%;
        background: #0a0f1a;
        color: var(--text);
        border: 1px solid rgba(148,163,184,.25);
        border-radius: 12px;
        padding: 10px 12px;
        outline: none;
        transition: border .15s ease, box-shadow .15s ease;
      }
      input:focus, select:focus, textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(59,130,246,.18);
      }
      textarea { height: 180px; resize: vertical; }

      .btn-row { display:flex; gap:10px; flex-wrap:wrap; }
      .btn {
        border: none;
        padding: 10px 14px;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 600;
        letter-spacing: .2px;
        transition: transform .08s ease, background .18s ease, box-shadow .18s ease;
      }
      .btn:active { transform: translateY(1px); }
      .btn-primary { background: var(--primary); color: #fff; }
      .btn-primary:hover { background: var(--primary-600); box-shadow: 0 6px 16px rgba(37,99,235,.35); }
      .btn-outline { background: transparent; color: var(--text); border: 1px solid rgba(148,163,184,.35); }
      .btn-outline:hover { border-color: var(--primary); color: #fff; box-shadow: 0 6px 16px rgba(59,130,246,.25); }

      .helper {
        padding:10px; border:1px dashed rgba(148,163,184,.35); border-radius:12px; color:var(--muted);
        background: rgba(148,163,184,.06);
      }

      .status { margin-top:8px; font-weight:600; }
      .ok { color: var(--accent); }
      .err { color: var(--danger); }
    </style>
  </head>
  <body>
    <div class="container">
      <section class="hero">
        <h1>เครื่องมือผู้ดูแล • License Management</h1>
        <p>ใช้คีย์ส่วนตัว Ed25519 เพื่อสร้างหรือปิดการใช้งาน license</p>
      </section>

    <section class="card">
      <h3>คีย์และการอ้างอิง</h3>
      <div class="grid-2">
        <div>
          <label>คีย์ส่วนตัว (PEM)</label>
          <div class="btn-row">
            <button class="btn btn-outline" id="btnSelectKey">เลือกไฟล์คีย์ส่วนตัว...</button>
          </div>
          <div id="keyPath" style="margin-top:6px;color:#555"></div>
        </div>
        <div>
          <label>รหัสคีย์สาธารณะ (pubkey_id)</label>
          <input id="pubkeyId" value="admin-key-2025" />
        </div>
      </div>
    </section>

    <section class="card">
      <h3>รายละเอียดไลเซนส์</h3>
      <div class="grid-2">
        <div>
          <label>Hardware ID ของเครื่องลูกค้า</label>
          <input id="hardwareId" placeholder="เช่น sha256:<hash>" />
        </div>
        <div>
          <label>License ID</label>
          <input id="licenseId" placeholder="เช่น LIC-2025-0001" />
        </div>
      </div>
      <div class="grid-2" style="margin-top:8px">
        <div>
          <label>จำนวนวันใช้งาน (Days)</label>
          <input id="durationDays" type="number" value="365" />
        </div>
        <div>
          <label>การตั้งเวลา</label>
          <div class="helper">
            ระบบจะตั้งค่าเวลาอัตโนมัติ:<br/>
            - Not Before = ย้อน 30 นาทีจากเวลาปัจจุบัน (UTC)<br/>
            - Expires At = เวลาปัจจุบัน + จำนวนวันที่กำหนด (UTC)
          </div>
        </div>
      </div>
      <div class="grid-2" style="margin-top:8px">
        <div>
          <label>Grace Period (days)</label>
          <input id="graceDays" type="number" value="0" />
        </div>
        <div>
          <label>Time Tolerance (sec)</label>
          <input id="tolSec" type="number" value="300" />
        </div>
      </div>
      <div style="margin-top:8px">
        <label>โหมด</label>
        <select id="mode">
          <option value="revoke" selected>ปิดการใช้งาน (revoked)</option>
          <option value="active">ออกสิทธิ์ใช้งานปกติ</option>
        </select>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="btnGenerate">สร้างไฟล์</button>
      </div>
    </section>

    <section class="card">
      <h3>ผลลัพธ์ (Preview)</h3>
      <textarea id="preview" readonly></textarea>
      <div id="status" class="status"></div>
      <div class="btn-row">
        <button class="btn btn-outline" id="btnSave" disabled>บันทึกเป็น license.dat...</button>
      </div>
    </section>

    </div>
    <script src="renderer.js"></script>
  </body>
  </html>
